name: Source validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PORT: "5197"
      BASE_PATH: /
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify every configured output
        run: |
          export VILLAGE_BUILD_STARTED_MS="$(node -e 'console.log(Date.now())')"
          pnpm run build
          node scripts/verify-build-outputs.mjs
      - name: Test all declared workspaces
        run: pnpm -r --if-present run test
      - name: Test post-merge hook with fake pnpm only
        run: node --test scripts/post-merge.test.mjs
